name: Bot checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dictionary_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: dictionary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Offline tests and real PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgresql://dictionary_test:test-password@localhost:5432/dictionary_test
        run: python -m unittest discover -s tests -v
