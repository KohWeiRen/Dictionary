name: Diagnose Spanish AI
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Check shared database and one Gemini lesson
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_OWNER_ID: ${{ secrets.BOT_OWNER_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SPANISH_LEVEL: ${{ vars.SPANISH_LEVEL }}
          AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT }}
          REQUIRE_DATABASE: "true"
        run: python -m Custom_modules.diagnose
