name: Daily vocabulary and Spanish practice

on:
  schedule:
    - cron: "0 22 * * *"   # 06:00 Asia/Singapore; GitHub may delay scheduled runs
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dictionary-daily
      cancel-in-progress: false

    steps:
      - name: Checkout repository  # select the repository to use
        uses: actions/checkout@v4

      - name: Set up Python # set up the python environment to use
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies # install all the modules required to run this script
        run: pip install -r requirements.txt

      - name: Run daily task # run the actual script
        env:
          TELEGRAM_API_KEY: ${{ secrets.TELEGRAM_API_KEY }}
          BOT_OWNER_ID: ${{ secrets.BOT_OWNER_ID }}
          MERRIAM_WEBSTER_DICT_API: ${{ secrets.MERRIAM_WEBSTER_DICT_API}}
          MERRIAM_WEBSTER_SPANISH_DICT_API: ${{ secrets.MERRIAM_WEBSTER_SPANISH_DICT_API}}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REQUIRE_DATABASE: "true"
          AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          SPANISH_LEVEL: ${{ vars.SPANISH_LEVEL }}
          LEARNING_START_DATE: ${{ vars.LEARNING_START_DATE }}
        run: |
          python get_random_word_daily.py --check
          python get_random_word_daily.py
